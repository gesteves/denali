---
EnableDefaultLinters: true
exclude:
  # Generated by `rake svg`.
  - '**/app/views/partials/svg/**'
  # Installed code: CI's setup-ruby puts the gems in vendor/bundle.
  - '**/vendor/**'
  - '**/node_modules/**'
linters:
  AllowedScriptType:
    # Structured data for search engines.
    allowed_types:
      - 'text/javascript'
      - 'application/ld+json'
