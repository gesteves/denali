name: "CI"

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCTION_URL: ${{ secrets.PRODUCTION_URL || 'https://denali.fly.dev' }}
  S3_REGION: ${{ secrets.S3_REGION }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  DENALI_SECRET: ${{ secrets.DENALI_SECRET }}
  GOOGLE_APPS_DOMAIN: ${{ secrets.GOOGLE_APPS_DOMAIN }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://rails:password@localhost:5432/rails_test
      NODE_OPTIONS: "--openssl-legacy-provider"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3
          yarn install --frozen-lockfile

      - name: Set up database
        run: bin/rails db:schema:load

      - name: Compile assets
        run: bin/rails assets:precompile

      - name: Run tests
        id: rspec
        continue-on-error: true
        run: |
          set -o pipefail
          bundle exec rspec 2>&1 | tee rspec-output.log
          echo "outcome=success" >> $GITHUB_OUTPUT
        env:
          RSPEC_FAILED: false

      - name: Check RSpec result
        if: steps.rspec.outcome == 'failure'
        run: echo "RSPEC_FAILED=true" >> $GITHUB_ENV

      - name: Run JavaScript tests
        id: vitest
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:run 2>&1 | tee vitest-output.log

      - name: Check Vitest result
        if: steps.vitest.outcome == 'failure'
        run: echo "VITEST_FAILED=true" >> $GITHUB_ENV

      - name: Upload test logs
        if: steps.rspec.outcome == 'failure' || steps.vitest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            rspec-output.log
            vitest-output.log
          retention-days: 1

      - name: Fail if tests failed
        if: steps.rspec.outcome == 'failure' || steps.vitest.outcome == 'failure'
        run: exit 1

  analyze-test-failure:
    name: Analyze test failure
    runs-on: ubuntu-latest
    needs: test
    if: failure()
    outputs:
      analysis: ${{ steps.claude.outputs.conclusion }}

    steps:
      - uses: actions/checkout@v4

      - name: Download test logs
        uses: actions/download-artifact@v4
        with:
          name: test-logs
          path: logs

      - name: Prepare log content
        id: logs
        run: |
          {
            echo 'content<<EOF'
            echo "=== RSpec Output (last 100 lines) ==="
            tail -100 logs/rspec-output.log 2>/dev/null || echo "No RSpec log"
            echo ""
            echo "=== Vitest Output (last 100 lines) ==="
            tail -100 logs/vitest-output.log 2>/dev/null || echo "No Vitest log"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Analyze failure with Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Analyze this test failure output and provide a short sentence explaining what failed and why. Be specific about the test names and error types. No markdown formatting.

            ${{ steps.logs.outputs.content }}
          claude_args: "--max-turns 1 --model claude-haiku-4-5"

  notify-test:
    name: Notify test result
    runs-on: ubuntu-latest
    needs: [test, analyze-test-failure]
    if: always()

    steps:
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Set branch or PR info
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "BRANCH_NAME=${{ github.head_ref }}" >> $GITHUB_ENV
            echo "COMMIT_MESSAGE=$(echo "${{ github.event.pull_request.head.commit.message }}" | head -n 1)" >> $GITHUB_ENV
            echo "BRANCH_URL=${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          else
            echo "BRANCH_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "COMMIT_MESSAGE=$(echo "${{ github.event.head_commit.message }}" | head -n 1)" >> $GITHUB_ENV
            echo "BRANCH_URL=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Notify Slack (success)
        if: needs.test.result == 'success'
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Tests passed on <${{ env.BRANCH_URL }}|`${{ env.BRANCH_NAME }}`>"
            attachments:
              - color: "good"
                fallback: "Tests passed on ${{ env.BRANCH_NAME }}"
                text: "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ env.SHORT_SHA }}`> - ${{ env.COMMIT_MESSAGE }}"
                footer: "<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"

      - name: Notify Slack (failure with analysis)
        if: needs.test.result == 'failure' && needs.analyze-test-failure.outputs.analysis
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Tests <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> on <${{ env.BRANCH_URL }}|`${{ env.BRANCH_NAME }}`>"
            attachments:
              - color: "danger"
                fallback: "Tests failed on ${{ env.BRANCH_NAME }}: ${{ needs.analyze-test-failure.outputs.analysis }}"
                text: "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ env.SHORT_SHA }}`> - ${{ env.COMMIT_MESSAGE }}\n\n${{ needs.analyze-test-failure.outputs.analysis }}"
                footer: "<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"

      - name: Notify Slack (failure)
        if: needs.test.result == 'failure' && !needs.analyze-test-failure.outputs.analysis
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Tests <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> on <${{ env.BRANCH_URL }}|`${{ env.BRANCH_NAME }}`>"
            attachments:
              - color: "danger"
                fallback: "Tests failed on ${{ env.BRANCH_NAME }}"
                text: "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ env.SHORT_SHA }}`> - ${{ env.COMMIT_MESSAGE }}"
                footer: "<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"

  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    needs: test
    concurrency: deploy-group
    if: github.ref == 'refs/heads/release' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, '[no deploy]')

    steps:
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Notify Slack (deploy starting)
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Deploy <https://fly.io/apps/denali/monitoring|starting> :hourglass_flowing_sand:"
            attachments:
              - color: "#439FE0"
                fallback: "Deploy starting: https://fly.io/apps/denali/monitoring"
                text: "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ env.SHORT_SHA }}`> - ${{ github.event.head_commit.message }}"
                footer: "<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"

      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        id: fly_deploy
        continue-on-error: true
        run: |
          set -o pipefail
          flyctl deploy --remote-only 2>&1 | tee deploy-output.log
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Prepare deploy log
        id: deploy_log
        if: steps.fly_deploy.outcome == 'failure'
        run: |
          {
            echo 'content<<EOF'
            tail -100 deploy-output.log
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Analyze deploy failure with Claude
        id: claude_deploy
        if: steps.fly_deploy.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Analyze this Fly.io deploy failure and provide a short sentence explaining what went wrong. Be specific. No markdown formatting.

            ${{ steps.deploy_log.outputs.content }}
          claude_args: "--max-turns 1 --model claude-haiku-4-5"

      - name: Fail if deploy failed
        if: steps.fly_deploy.outcome == 'failure'
        run: exit 1

      - name: Notify Slack (deploy successful)
        if: steps.fly_deploy.outcome == 'success'
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Deploy <${{ env.PRODUCTION_URL }}|successful> :rocket:"
            attachments:
              - color: "good"
                fallback: "Deploy successful: ${{ env.PRODUCTION_URL }}"
                text: "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ env.SHORT_SHA }}`> - ${{ github.event.head_commit.message }}"
                footer: "<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"

      - name: Notify Slack (deploy failed with analysis)
        if: steps.fly_deploy.outcome == 'failure' && steps.claude_deploy.outputs.conclusion
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Deploy <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> :warning:"
            attachments:
              - color: "danger"
                fallback: "Deploy failed: ${{ steps.claude_deploy.outputs.conclusion }}"
                text: "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ env.SHORT_SHA }}`> - ${{ github.event.head_commit.message }}\n\n${{ steps.claude_deploy.outputs.conclusion }}"
                footer: "<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"

      - name: Notify Slack (deploy failed)
        if: steps.fly_deploy.outcome == 'failure' && !steps.claude_deploy.outputs.conclusion
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Deploy <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> :warning:"
            attachments:
              - color: "danger"
                fallback: "Deploy failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                text: "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ env.SHORT_SHA }}`> - ${{ github.event.head_commit.message }}"
                footer: "<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"
