user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr;

    gzip on;

    # Thumbor upstream (single instance on Fly.io)
    upstream thumbor {
        server 127.0.0.1:8000;
    }

    server {
        listen 8888;
        server_name _;

        # Important: Don't merge slashes (same as DO config)
        merge_slashes off;

        # Health check
        location /healthcheck {
            proxy_pass http://thumbor/healthcheck;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Thumbor with /thumbor/ prefix
        # The trailing slash in proxy_pass strips /thumbor/ from the path
        location /thumbor/ {
            proxy_pass http://thumbor/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
