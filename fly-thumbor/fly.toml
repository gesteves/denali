# fly.toml app configuration file generated for denali-thumbor on 2025-11-29T13:48:17-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'denali-thumbor'
primary_region = 'iad'

[build]

[env]
  LOG_LEVEL = 'info'
  PORT = '8888'

[http_service]
  internal_port = 8888
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthcheck'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
