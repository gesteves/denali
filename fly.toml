# fly.toml app configuration file generated for denali on 2025-11-29T15:20:42-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'denali'
primary_region = 'iad'
console_command = '/app/bin/rails console'

[build]

[deploy]
  release_command = 'bin/rails db:migrate'

[env]
  RAILS_ENV = 'production'
  RAILS_LOG_TO_STDOUT = 'true'
  RAILS_SERVE_STATIC_FILES = 'true'
  RAILS_MAX_THREADS = '10'
  WEB_CONCURRENCY = '1'
  SIDEKIQ_CONCURRENCY = '5'
  CACHE_TTL = '86400'
  SKYLIGHT_ENABLE_SIDEKIQ = 'true'
  SKYLIGHT_IGNORED_ENDPOINTS = 'HealthController#show'
  ELASTICSEARCH_TIMEOUT="1"

[processes]
  web = 'bundle exec puma -C config/puma.rb'
  worker = 'bundle exec sidekiq -t 25'

[[restart]]
  policy = 'on-failure'
  retries = 10

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['web']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 10

  [[http_service.checks]]
    interval = '60s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthcheck'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  processes = ['web']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  processes = ['worker']
