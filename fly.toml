# fly.toml app configuration file generated for denali on 2026-06-08T04:11:22Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'denali'
primary_region = 'iad'
console_command = '/app/bin/rails console'
kill_signal = 'SIGTERM'
kill_timeout = 30

[build]

[deploy]
  release_command = 'bin/rails db:migrate'

[env]
  RAILS_ENV = 'production'
  RAILS_LOG_TO_STDOUT = 'true'
  RAILS_SERVE_STATIC_FILES = 'true'
  RAILS_MAX_THREADS = '5'
  WEB_CONCURRENCY = '0'
  SIDEKIQ_CONCURRENCY = '5'
  # Backstop only: CachePurgeJob is what keeps cached pages fresh.
  CACHE_TTL = '86400'
  RUBY_YJIT_ENABLE = '1'
  ELASTICSEARCH_TIMEOUT="1"

[processes]
  web = 'bundle exec puma -C config/puma.rb'
  worker = 'bundle exec sidekiq -t 25'

[[restart]]
  policy = 'on-failure'
  retries = 10

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ['web']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 5

  [[http_service.checks]]
    interval = '60s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthcheck'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  processes = ['web']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '2gb'
  processes = ['worker']
