# The responsive images configuration. `sizes` describes the width of the element, and `srcset` is
# the list of the candidates that Cloudflare Images renders.
#
# ⚠️ Each candidate is one transformation for each image. Keep each list small.
#
# The method for a new list, and for a change to a `sizes` value:
#   1. Render the element at the logical width of each device below.
#   2. Measure the element, and do not calculate it. Characteristics of the image (such as the zoom-in feature in `entry`) can make the true width different from the column arithmetic.
#   3. Multiply by the scale factor of the device, and round up.
#   4. Remove each duplicate, and add the desktop width at 1x and at 2x.
#
# The devices are the current iPhones, and a desktop at the widest breakpoint:
#   390, 402, 420, 440 at 3x  — iPhone 17e, iPhone 17 and 17 Pro, iPhone Air, iPhone 17 Pro Max
entry: &entry
  srcset:
    - 1680
    - 3360
    - 1122
    - 1158
    - 1212
    - 1272
  src: 1272
  sizes:
    - "(min-width: 1696px) 1680px"
    - calc(100vw - 16px)
entry_list: &entry_list
  srcset:
    - 410
    - 820
    - 549
    - 369
    - 387
    - 408
  sizes:
    - auto
    - "(min-width: 1678px) 410px"
    - "(min-width: 1280px) calc((100vw - (8px * 5)) / 4)"
    - "(min-width: 400px) calc((100vw - (8px * 4)) / 3)"
    - "calc((100vw - (8px * 3)) / 2)"
entry_list_square:
  <<: *entry_list
admin_entry:
  srcset:
    - 2688
    - 2304
    - 1920
    - 1026
    - 1062
    - 1116
    - 1176
  sizes:
    - auto
    - "(min-width: 1472px) 1344px"
    - "(min-width: 1280px) 1152px"
    - "(min-width: 1088px) 960px"
    - "calc(100vw - 3rem)"
admin_edit:
  srcset:
    - 2200
    - 1880
    - 1560
    - 1026
    - 1062
    - 1116
    - 1176
  sizes:
    - auto
    - "(min-width: 1472px) 1100px"
    - "(min-width: 1280px) 940px"
    - "(min-width: 1088px) 780px"
    - "(min-width: 769px) calc(((100vw - 4.5rem)/6) * 5)"
    - "calc(100vw - 3rem)"
admin_queue:
  srcset:
    - 490
    - 414
    - 336
  sizes:
    - auto
    - "(min-width: 1472px) 245px"
    - "(min-width: 1280px) 207px"
    - "(min-width: 1088px) 168px"
    - "(min-width: 769px) calc(((100vw - 3rem)/4) - 1.5rem)"
    - "calc((100vw - 3rem)/2 - 1.5rem)"
map:
  srcset:
    - 232
    - 464
    - 696
  sizes:
    - auto
    - 232px

