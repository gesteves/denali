:concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY") { 10 }.to_i %>
:queues:
  # Weighted rather than strict: with strict priority, low (standard.site syncs,
  # caption checks, Flickr groups) waits until high and default are both empty,
  # which a burst of photo processing can keep them from being for a while.
  - [high, 6]
  - [default, 3]
  - [low, 1]
:scheduler:
  # Each cron names its zone. Without one, Fugit falls back to Rails' Time.zone,
  # which happens to be Eastern in production but is easy to change by accident.
  #
  # The random shares run a few minutes past the hour, after PublishJob: one that
  # started in the same second as a publish couldn't see the new photo, and would
  # share an old one alongside it.
  :schedule:
    publish_queued_entries:
      cron: '0 0 * * * * America/New_York' # Run every hour
      class: PublishJob
      queue: high
      description: "Attempts to publish a queued entry every hour."
    random_cherry_blossoms:
      cron: '5 12 * 4 * America/New_York'  # Run at 12:05 PM ET every day in April
      class: RandomShareJob
      queue: high
      args: ['Cherry Blossoms', ['Bluesky', 'Mastodon', 'Instagram', 'Threads'], 1, []]
      description: "Share a random cherry blossom photo once a day in April."
    random_landscape:
      cron: '5 14 * * * America/New_York'  # Run at 2:05 PM ET every day
      class: RandomShareJob
      queue: high
      args: ['Landscapes', ['Bluesky', 'Mastodon', 'Instagram', 'Threads'], 12, 'Cherry Blossoms']
      description: "Share a random landscape photo once a day."
    random_when_no_new_photo:
      cron: '1 10 * * * America/New_York'  # Run at 10:01 AM ET every day
      class: RandomShareJob
      queue: high
      args: [[], ['Bluesky', 'Mastodon', 'Instagram', 'Threads'], 12, 'Cherry Blossoms']
      description: "Share a random photo once a day, unless a new photo was published."
    random_once_a_day:
      cron: '5 16 * 4 * America/New_York'  # Run at 4:05 PM ET every day in April
      class: RandomShareJob
      queue: high
      args: [[], ['Bluesky', 'Mastodon', 'Instagram', 'Threads'], 12, 'Cherry Blossoms']
      description: "Share a random photo once a day in April."
    random_twice_a_day:
      cron: '5 12,16 * 1,2,3,5,6,7,8,9,10,11,12 * America/New_York'  # Run at 12:05 PM ET and 4:05 PM ET every day, except in April
      class: RandomShareJob
      queue: high
      args: [[], ['Bluesky', 'Mastodon', 'Instagram', 'Threads'], 12, 'Cherry Blossoms']
      description: "Share a random photo twice a day, except in April."
    random_wildlife:
      cron: '5 18 * * * America/New_York'  # Run at 6:05 PM ET every day
      class: RandomShareJob
      queue: high
      args: ['Wildlife', ['Bluesky', 'Mastodon', 'Instagram', 'Threads'], 12, 'Cherry Blossoms']
      description: "Shares a random wildlife photo once a day."
    superbowl:
      cron: '59 11,13,15,17 14 2 * America/New_York'  # Run at 11:59 AM, 1:59 PM, 3:59 PM, and 5:59 PM ET on February 14
      class: RandomShareJob
      queue: high
      args: ['Great Gray Owls', ['Bluesky', 'Mastodon', 'Instagram', 'Threads'], 1, [], true]
      description: "Share a random Great Gray Owls photo during the Super Bowl."
    database_backup:
      cron: '0 3 * * * America/New_York'  # Run at 3:00 AM every day
      class: DatabaseBackupJob
      queue: low
      description: "Creates a database backup and uploads it to S3."
