  - text: "I strive to minimize the environmental impact of my work by considering the potential ecological ramifications of publishing my photos, and of the equipment, processes, and techniques I use to make them."
  - text: "I follow [Leave No Trace](https://lnt.org/) principles at all times, abide by all applicable laws and regulations for the locations and parks I visit, and avoid, to the best of my abilities, causing any damage to natural and cultural resources."
  - text: "All my wildlife photography is made in the wild, without baiting, and attempting to disrupt my subjects as little as possible, without engaging in behaviors that endanger them, myself, or others."
