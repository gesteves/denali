posts:
  - text: "In 2021, one of my photos, “[Close Encounter at Antelope Flats](https://www.allencompassingtrip.com/2019/4/16/2619/close-encounter),” was a finalist in London’s Natural History Museum’s [Wildlife Photographer of the Year, People’s Choice Awards](https://www.nhm.ac.uk/wpy/gallery/2020-close-encounter). It was featured in the [BBC](https://www.bbc.com/news/av/entertainment-arts-56009827), the [Jackson Hole News&Guide](https://www.jhnewsandguide.com/news/environmental/local/local-photographer-earns-international-wildlife-accolade/article_6d89e560-114c-5575-bc54-f49620c56734.html), [Jackson Hole Magazine](https://jacksonholemagazine.com/local-knowledge-guillermo-esteves/), and [GEO Magazine](https://www.geo.fr/)."
