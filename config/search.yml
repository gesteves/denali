# Search configuration for Elasticsearch
# These values can be tweaked without code changes

# Minimum relevance score for search results
# Results below this threshold are filtered out
# Higher values = stricter matching, fewer results
# Lower values = more lenient, more results
min_score: 0.1

# Recency boost configuration
# Newer content gets a relevance boost that decays over time
recency_boost:
  # Reference point for decay calculation
  origin: now
  # Time period over which the boost decays to half
  # e.g., "90d" means content 90 days old gets half the boost
  scale: 365d
  # Decay factor (0-1): how much boost remains at the scale point
  # 0.5 = half the boost remains at scale distance
  decay: 0.5
  # How to combine function score with query score
  # multiply, sum, avg, first, max, min
  boost_mode: multiply
  # Weight of the recency function (higher = more impact)
  weight: 1.2

# Synonyms for search
# Format: "word1,word2,word3" - all words are equivalent
# These help users find content using different terminology
synonyms:
  - "bw,b&w,black and white,black & white,black&white,monochrome,monochromatic"
  - "color,colour"
  - "landscape,landscapes,scenery,scenic,landscape photography"
  - "mountain,mountains,peak,peaks,summit"
  - "grand teton,grand tetons,tetons"
  - "yellowstone,yellow stone"
  - "zion,zions"
  - "forest,woods,woodland"
  - "wildlife,animal,animals,wildlife photography"
  - "bird,birds,avian"
  - "flower,flowers,floral,bloom"
  - "macro,closeup,close-up"
  - "street,streets,urban,street photography"
  - "grizzly,grizzly bear,brown bear"

# Related entries temporal proximity
# Entries closer in time to the current entry are boosted
# Uses bidirectional Gaussian decay centered on the entry's date
related_entries:
  # Time period over which the boost decays to half
  # e.g., "365d" means entries 1 year before or after get half the boost
  scale: 365d
  # Decay factor (0-1): how much boost remains at the scale point
  decay: 0.5
  # How to combine function score with query score
  boost_mode: multiply
  # Weight of the temporal proximity function
  weight: 1.5
