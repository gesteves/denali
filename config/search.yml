# Related entries scoring
# Tags dominate; recency and proximity are tiebreakers
related_entries:
  # How to combine function scores with query score
  boost_mode: sum

  recency:
    scale: 365d
    decay: 0.75
    weight: 0.1

  proximity:
    scale: 10km
    decay: 0.5
    weight: 0.1
