default: &default
  adapter: postgresql
  encoding: unicode
  host: postgres
  username: postgres
  password:
  # Enough for whichever process uses more threads: Puma's or Sidekiq's. The
  # pool opens connections lazily, so the bigger number costs the other nothing.
  pool: <%= [ENV.fetch("RAILS_MAX_THREADS", 5).to_i, ENV.fetch("SIDEKIQ_CONCURRENCY", 10).to_i].max %>

development:
  <<: *default
  database: denali_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: denali_test

production:
  adapter: postgresql
  encoding: unicode
  # See the note on the default pool above.
  pool: <%= [ENV.fetch("RAILS_MAX_THREADS", 5).to_i, ENV.fetch("SIDEKIQ_CONCURRENCY", 10).to_i].max %>
